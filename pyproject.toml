[project]
name = "ff-bot"
version = "0.4.0"
description = "Discord bot for ESPN fantasy football leagues"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cachetools>=7.1.4,<8",
    "discord.py>=2.7.1,<3",
    "espn-api>=0.46,<0.47",
    "fpdf2>=2.8.7,<3",
    "markdown-it-py>=4.2,<5",
    "openai>=2.28.0,<3",
    "python-dotenv>=1.2.2,<2",
    "requests>=2.34.2,<3",
    "tabulate>=0.10,<0.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "requests-mock>=1.12.1,<2",
    "ruff>=0.15.22,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["utils/tests"]
markers = [
    "live: tests that use credentials to access the live ESPN API",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
