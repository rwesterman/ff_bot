# fly.toml app configuration file generated for ff-bot on 2023-09-13T15:05:57-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "ff-bot"
primary_region = "dfw"

[build]

[processes]
  worker = "litestream replicate -restore-if-db-not-exists"

[env]
  CHAT_HISTORY_DB = "/data/chat_history.db"
  DEEPSEEK_MAX_TOKENS = "4096"
  DEEPSEEK_MODEL = "deepseek-v4-flash"
  DEEPSEEK_THINKING_ENABLED = "false"
  OPENAI_EMBEDDING_DIMENSIONS = "512"
  OPENAI_EMBEDDING_MODEL = "text-embedding-3-small"
  RAG_CHANNEL_IDS = "604075794620219414,1145771776257818674,1252383178912567466,1147256554144419881,1145771716216356964,1151148913756213270,1278382036930789550,1386706556929966131,1147257515927674930,1154131955441471640,1154133577357869076"
  RAG_SYNC_INTERVAL_SECONDS = "3600"
  RULES_GITHUB_REF = "main"
  RULES_GITHUB_REPOSITORY = "rwesterman/longview_league_rules"

[[mounts]]
  source = "ff_bot_data"
  destination = "/data"
  processes = ["worker"]
